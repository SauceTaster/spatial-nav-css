name: Feature request
description: Propose an addition — device adapter, framework binding, engine behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: For devices, sketch the InputAdapter; for engine behavior, the CSS/data-attribute surface.
